services:
  - type: web
    name: oluyewo-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EMBEDDING_BACKEND
        value: gemini
      - key: GEMINI_API_KEY_OOC
        sync: false
      - key: GEMINI_API_KEY_EMBEDDING
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_TOKEN_PALIGEMMA
        sync: false
      